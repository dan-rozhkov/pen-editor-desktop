name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # test/snapshotOverlay.test.ts drives SNAPSHOT_JS in real headless
      # Chromium; under CI it fails (not skips) if the browser is missing.
      - run: npx playwright install --with-deps chromium
      - run: npm test
      # Catches the compile-only failure modes the unit tests can't: the
      # renderer script must stay a plain script and preloads must stay CJS.
      - run: npm run build

  # The Playwright _electron smoke launches a real Electron binary, which needs
  # a display on Linux — hence xvfb-run. Kept a separate job so a flaky launch
  # can't mask a genuine unit/build failure.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # ELECTRON_DISABLE_SANDBOX: node_modules' chrome-sandbox is not SUID-root
      # on a runner, so a sandboxed launch aborts. This relaxes the OS sandbox
      # for the test process only — the shipped app's per-view
      # `sandbox: true` is unaffected.
      # xvfb-run's default screen is 640x480x8, smaller than the app's
      # 1440x900 window and only 8-bit colour; give it a real desktop-sized
      # 24-bit screen so the e2e window matches what users run.
      - run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" npm run test:e2e
        env:
          ELECTRON_DISABLE_SANDBOX: "1"
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
