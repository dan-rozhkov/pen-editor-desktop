<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; script-src 'self'; img-src data:"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Passwords</title>
    <link rel="stylesheet" href="passwords.css" />
  </head>
  <body>
    <div class="app">
      <section class="list-pane" aria-label="Logins">
        <h1 class="pane-title">Passwords</h1>
        <div class="list-head">
          <label class="search">
            <span class="icon" data-pen-slot="MagnifyingGlass"></span>
            <input id="search" type="search" placeholder="Search logins" aria-label="Search logins" autocomplete="off" spellcheck="false" />
          </label>
          <button id="add-btn" class="btn-accent icon-only" type="button" aria-label="Add login" title="Add login">
            <span class="icon" data-pen-slot="Plus"></span>
          </button>
        </div>
        <div id="never-head" class="never-head" hidden>
          <button id="never-back" class="btn btn-ghost icon-only" type="button" aria-label="Back to logins" title="Back to logins">
            <span class="icon" data-pen-slot="ArrowLeft"></span>
          </button>
          <h2 class="never-title">Never ask to save</h2>
        </div>
        <p id="unavailable" class="banner" role="alert" hidden>
          Secure storage is not available on this system, so passwords cannot be saved.
        </p>
        <p id="status" class="banner" role="alert" hidden></p>
        <div id="list" class="list" role="listbox" aria-label="Saved logins"></div>
        <div id="list-empty" class="list-empty" hidden>
          <p id="list-empty-title" class="empty-title"></p>
          <p id="list-empty-text" class="empty-text"></p>
        </div>
        <div class="list-foot">
          <button id="never-link" class="link-btn" type="button" hidden></button>
          <p id="storage-note" class="storage-note">Encrypted on this device</p>
        </div>
      </section>

      <main id="detail" class="detail-pane" aria-live="polite"></main>
    </div>

    <script src="../tabbar/glyphs.js"></script>
    <script src="helpers.js"></script>
    <script src="renderer.js"></script>
  </body>
</html>
