<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; script-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Passwords</title>
    <link rel="stylesheet" href="passwords.css" />
  </head>
  <body>
    <main>
      <p id="unavailable" class="banner" role="alert" hidden>
        Secure storage is not available on this system, so passwords cannot be saved.
      </p>

      <section aria-labelledby="add-title">
        <h2 id="add-title">Add a login</h2>
        <form id="add-form" autocomplete="off">
          <label>Site
            <input id="site" type="text" placeholder="example.com (https) or http://localhost:3000" autocomplete="off" spellcheck="false" required />
          </label>
          <label>Username
            <input id="username" type="text" autocomplete="off" spellcheck="false" required />
          </label>
          <label>Password
            <input id="password" type="password" autocomplete="new-password" required />
          </label>
          <label>Label <span class="optional">(optional)</span>
            <input id="label" type="text" placeholder="admin, test user" autocomplete="off" />
          </label>
          <div class="row">
            <button id="add-btn" type="submit" class="primary">Save login</button>
            <span id="form-status" class="status" role="status"></span>
          </div>
        </form>
      </section>

      <section aria-labelledby="saved-title">
        <h2 id="saved-title">Saved logins</h2>
        <p id="saved-empty" class="empty" hidden>No saved logins yet.</p>
        <ul id="saved-list" class="list"></ul>
      </section>

      <section id="never-section" aria-labelledby="never-title" hidden>
        <h2 id="never-title">Never saved</h2>
        <p class="hint">No prompt to save a password appears on these sites.</p>
        <ul id="never-list" class="list"></ul>
      </section>
    </main>
    <script src="renderer.js"></script>
  </body>
</html>
