<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>History</title>
    <link rel="stylesheet" href="../tabbar/tokens.css" />
    <link rel="stylesheet" href="history.css" />
  </head>
  <body>
    <div class="page">
      <header class="head">
        <h1 class="title">History</h1>
        <div class="toolbar">
          <label class="search">
            <span class="icon" data-pen-slot="MagnifyingGlass"></span>
            <input id="search" type="search" placeholder="Search history" aria-label="Search history" autocomplete="off" spellcheck="false" />
          </label>
          <button id="clear-btn" class="btn-outline" type="button" disabled>Clear history…</button>
        </div>
      </header>
      <main id="scroll" class="scroll">
        <div id="list" class="list" role="list" aria-label="Visited pages"></div>
        <div id="empty" class="empty" hidden>
          <p id="empty-title" class="empty-title"></p>
          <p id="empty-text" class="empty-text"></p>
        </div>
      </main>
    </div>

    <script src="../tabbar/glyphs.js"></script>
    <script src="renderer.js"></script>
  </body>
</html>
